
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Amparo</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f7f7f7;
      color: #333;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #2c3e50;
      color: white;
      padding: 20px;
      text-align: center;
    }
    main {
      max-width: 700px;
      margin: 40px auto;
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h1, h2 {
      color: #2c3e50;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }
    input[type="text"], input[type="date"], textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #2980b9;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 5px;
      margin-top: 20px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #1c5980;
    }
    .instrucciones {
      background-color: #ecf0f1;
      padding: 20px;
      border-left: 5px solid #3498db;
      border-radius: 5px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Generador de Amparo</h1>
    <p>Una herramienta ciudadana para proteger tus derechos</p>
  </header>
  <main>
    
    <h2>Tu documento está listo</h2>
    <p>Puedes descargarlo aquí:</p>
    <a href="/descargar"><button>Descargar DOCX</button></a>
    <h3>Datos para donativo:</h3>
    <p><b>Banco:</b> BANCO GENERAL</p>
    <p><b>Cuenta:</b> 1234567890</p>
    <p><b>CLABE:</b> 012345678901234567</p>
    <p><b>Nombre:</b> Iniciativa Ciudadana por la Privacidad</p>
    
  </main>
</body>
</html>
