
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Amparo</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f7f7f7;
      color: #333;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #2c3e50;
      color: white;
      padding: 20px;
      text-align: center;
    }
    main {
      max-width: 700px;
      margin: 40px auto;
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h1, h2 {
      color: #2c3e50;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }
    input[type="text"], input[type="date"], textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #2980b9;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 5px;
      margin-top: 20px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #1c5980;
    }
    .instrucciones {
      background-color: #ecf0f1;
      padding: 20px;
      border-left: 5px solid #3498db;
      border-radius: 5px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Generador de Amparo</h1>
    <p>Una herramienta ciudadana para proteger tus derechos</p>
  </header>
  <main>
    
    <h2>Formulario</h2>
    <form action="/generar" method="post">
        <label>Nombre:</label><input name="nombre" required>
        <label>CURP:</label><input name="curp" required>
        <label>Domicilio:</label><input name="domicilio" required>
        <label>Hechos:</label><textarea name="hechos" rows="4" required></textarea>
        <label>Fecha exacta en que tuvo conocimiento del acto reclamado:</label><input type="date" name="fecha" required>
        <label>Firma (escribe tu nombre completo):</label><input name="firma" required>
        <button type="submit">Generar Amparo</button>
    </form>
    
  </main>
</body>
</html>
